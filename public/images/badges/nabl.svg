<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Outer Seal Rings -->
  <circle cx="100" cy="95" r="90" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.95"/>
  <circle cx="100" cy="95" r="83" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
  <circle cx="100" cy="95" r="54" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
  
  <!-- Curved Upper Text: National Accreditation Board -->
  <path id="nablTopPath" d="M 26,95 A 74,74 0 1,1 174,95" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#nablTopPath" startOffset="50%" text-anchor="middle">
      राष्ट्रीय परीक्षण और अंशशोधन प्रयोगशाला
    </textPath>
  </text>
  
  <!-- Curved Lower Text: Bharat / NABL -->
  <path id="nablBotPath" d="M 174,95 A 74,74 0 0,1 26,95" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#nablBotPath" startOffset="50%" text-anchor="middle">
      ★ भारत · BHARAT ★
    </textPath>
  </text>
  
  <!-- Center Hexagram / Gear Star Emblem -->
  <g transform="translate(100, 95) scale(0.75)">
    <circle cx="0" cy="0" r="22" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M0,-22 L5,-5 L22,-5 L8,6 L14,22 L0,12 L-14,22 L-8,6 L-22,-5 L-5,-5 Z" fill="#FFFFFF" opacity="0.3" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="0" cy="0" r="8" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Prominent NABL Wordmark Below Seal (Never Clipped) -->
  <text x="100" y="222" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    NABL
  </text>
</svg>
