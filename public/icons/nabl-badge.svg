<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Border Rings -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="100" cy="100" r="56" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Curved Text Path for NABL Hindi -->
  <path id="nablTop" d="M 22,100 A 78,78 0 1,1 178,100" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.2" font-weight="700" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#nablTop" startOffset="50%" text-anchor="middle">
      राष्ट्रीय परीक्षण और अंशशोधन प्रयोगशाला
    </textPath>
  </text>
  
  <!-- Curved Text Path for Bharat -->
  <path id="nablBot" d="M 178,100 A 78,78 0 0,1 22,100" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#nablBot" startOffset="50%" text-anchor="middle">
      ★ भारत · NABL ACCREDITED ★
    </textPath>
  </text>
  
  <!-- Center NABL Gear / Star Emblem -->
  <g transform="translate(100, 80) scale(0.68)">
    <circle cx="0" cy="0" r="22" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M0,-22 L5,-5 L22,-5 L8,6 L14,22 L0,12 L-14,22 L-8,6 L-22,-5 L-5,-5 Z" fill="#FFFFFF" opacity="0.25" stroke="#FFFFFF" stroke-width="1.8" />
    <circle cx="0" cy="0" r="8" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- NABL Text -->
  <text x="100" y="128" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    NABL
  </text>
  <text x="100" y="139" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#FFFFFF" opacity="0.9" text-anchor="middle" letter-spacing="1">
    ISO / IEC 17025
  </text>
</svg>
