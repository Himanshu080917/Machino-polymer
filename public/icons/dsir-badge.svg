<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Border Rings -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="100" cy="100" r="56" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Curved Text Path for Department of Scientific & Industrial Research -->
  <path id="dsirTop" d="M 22,100 A 78,78 0 1,1 178,100" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7.8" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#dsirTop" startOffset="50%" text-anchor="middle">
      DEPARTMENT OF SCIENTIFIC &amp; INDUSTRIAL RESEARCH
    </textPath>
  </text>
  
  <!-- Curved Text Path for Govt of India -->
  <path id="dsirBot" d="M 178,100 A 78,78 0 0,1 22,100" fill="none" />
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#dsirBot" startOffset="50%" text-anchor="middle">
      ★ GOVT. OF INDIA ★
    </textPath>
  </text>
  
  <!-- Stylized Ashoka Capitol Emblem -->
  <g transform="translate(100, 70) scale(0.65)">
    <path d="M-12,-16 L12,-16 L15,0 L0,16 L-15,0 Z" fill="#FFFFFF" opacity="0.25" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="-6" r="4" fill="#FFFFFF" />
    <path d="M-6,-12 L6,-12 L8,-2 L0,8 L-8,-2 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  
  <!-- DSIR Box & Text -->
  <rect x="54" y="93" width="92" height="19" rx="3" fill="#FFFFFF" opacity="0.12" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="100" y="107" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    DSIR
  </text>
  <text x="100" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    RECOGNIZED
  </text>
  <text x="100" y="131" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="5" font-weight="700" fill="#FFFFFF" opacity="0.8" text-anchor="middle" letter-spacing="0.5">
    RECOGNITION FOR IN HOUSE R&amp;D
  </text>
</svg>
